[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
siftr-core = { path = "crates/siftr-core" }
siftr-store = { path = "crates/siftr-store" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
