[package]
name = "siftr"
description = "Wrap a test command, learn its behaviors, and surface what changed since recent runs, with evidence."
version = "0.1.7"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Daniel Pepper"]
repository = "https://github.com/dpep/siftr"
homepage = "https://github.com/dpep/siftr"
readme = "README.md"
keywords = ["rspec", "rails", "regression", "telemetry", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
# tests/ and examples/ need fixtures/ and local logs, which stay in the repo.
include = ["/src", "/assets", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE.txt"]

[[bin]]
name = "siftr"
path = "src/bin/siftr/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
# getrusage(2) only: rustix 1.1 exposes no rusage call. Already built for this target — rustix's own
# macOS backend links it — so it adds a name here, not a dependency to the tree.
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# PTY, termios and process groups, without unsafe; already in the tree through tempfile.
rustix = { version = "1.1.4", features = ["pty", "termios", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Signals delivered on a thread, so siftr can forward them and still persist the run.
signal-hook = "0.3.18"
tempfile = "3.27.0"
# The config file. Reading only: no `display`, since siftr parses TOML and never writes it.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
