[package]
name = "siftr-cli"
description = "The siftr binary: wrap a command, record its behaviors, and surface what changed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "siftr"
path = "src/main.rs"

[dependencies]
siftr-core.workspace = true
siftr-store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# PTY, termios and process groups, without unsafe; already in the tree through tempfile.
rustix = { version = "1.1.4", features = ["pty", "termios", "process"] }
# Signals delivered on a thread, so siftr can forward them and still persist the run.
signal-hook = "0.3.18"
