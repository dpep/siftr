[package]
name = "siftr"
description = "Wrap a test command, learn its behaviors, and surface what changed since recent runs, with evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["rspec", "rails", "regression", "telemetry", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "siftr"
path = "src/main.rs"

[dependencies]
siftr-core.workspace = true
siftr-store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# PTY, termios and process groups, without unsafe; already in the tree through tempfile.
rustix = { version = "1.1.4", features = ["pty", "termios", "process"] }
# Signals delivered on a thread, so siftr can forward them and still persist the run.
signal-hook = "0.3.18"

[dev-dependencies]
# Tests read the feedback table as a later analysis will, and break it to prove recording never fails a command.
rusqlite.workspace = true
